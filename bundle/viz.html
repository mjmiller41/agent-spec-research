entActionFlags.EMIT_FINAL_STATE\n};\n```\n\n---\n\n# 2. Constant-Time Verification Mechanics\n\nWhen the LLM emits an action, the runtime validates permission in a single CPU instruction:\n$$\\text{is\\_permitted} = (\\text{STATE\\_ACTION\\_MATRIX}[\\text{current\\_state}] \\ \\& \\ (1 \\ll \\text{action\\_id})) \\ne 0$$\n\nIf zero, the runtime instantly rejects the execution without evaluating costly string parsers or executing network calls, protecting underlying system resources.[^willard-louf-2023]\n\n---\n\n# Cross-Links & Related Concepts\n\n* [Finite State Machine Agent DSL](/specifications/finite_state_machine_agent_dsl.md)\n* [TypeScript Contract System for LLMs](/specifications/typescript_contract_system.md)\n* [Formal Verification and SMT Attestation](/mechanisms/formal_verification_and_smt_attestation.md)\n\n---\n\n# References & Citations\n\n[^microsoft-typechat-2023]: Hejlsberg, A., Lucco, S., & Rosenwasser, D. (2023, July 20). \"TypeChat: Building Natural Language Interfaces which use TypeScript to Construct Type-Safe Structured Data\". *Microsoft Open Source Blog*. https://github.com/microsoft/TypeChat. Retrieved 2026-08-31.\n[^willard-louf-2023]: Willard, B. T., & Louf, R. (2023, July 18). \"Efficient Guided Generation for Large Language Models\". *arXiv preprint*, arXiv:2307.09702. https://doi.org/10.48550/arXiv.2307.09702. Retrieved 2026-08-31.", "specifications/typescript_contract_system": "# Executive Summary\n\nWhile JSON Schema remains common in REST API ecosystems, it was designed for programmatic validation rather than generative language model prompting.[^microsoft-typechat-2023] Large Language Models are autoregressive statistical learners that exhibit far higher semantic comprehension when interacting with **concise, strongly-typed source code** than verbose JSON metadata dictionaries.[^microsoft-typechat-2023]\n\nThe **TypeScript Contract System (TCS)** utilizes TypeScript AST definitions (`.d.ts`) as the canonical interface language for LLM agents. By leveraging **discriminated unions**, **string literal enums**, **optional modifier flags**, and **compact inline JSDoc comments**, TCS reduces token consumption by up to 70% while improving output parsing reliability to >99.5%.[^microsoft-typechat-2023]\n\n```mermaid\ngraph TD\n    A[TypeScript Interface Definition] --> B[LLM Token Generation]\n    B --> C[JSON Serialized Output]\n    C --> D[TypeScript Compiler AST Type Checker]\n    D -->|Valid AST Type| E[Deterministic Runtime Execution]\n    D -->|Diagnostic Error e.g. TS2322| F[Targeted Error Ingestion & Dynamic Re-prompt]\n    F --> B\n```\n*Diagram 1: TypeScript AST contract compilation, validation, and diagnostic repair cycle. Source: Microsoft TypeChat / Deep Research (2026).*\n\n---\n\n# 1. Core TypeScript Primitives for LLM Prompting\n\n### 1.1 Discriminated Union Pattern\nDiscriminated unions provide unambiguous branching for polymorphic agent actions. The LLM uses the discriminator key (`kind` or `action`) to strictly lock downstream properties:\n\n```typescript\ntype AgentToolCall = \n  | { kind: \"database_query\"; sql: string; timeout_sec?: number }\n  | { kind: \"filesystem_read\"; absolute_path: string; max_bytes?: number }\n  | { kind: \"http_request\"; url: string; method: \"GET\" | \"POST\"; payload?: unknown };\n```\n\n### 1.2 String Literal Enums\nInstead of free-form strings, string literal unions enforce closed-set categorical variables:\n```typescript\ntype Severity = \"CRITICAL\" | \"HIGH\" | \"MEDIUM\" | \"LOW\" | \"INFO\";\ntype ResolutionStrategy = \"AUTO_FIX\" | \"MANUAL_ESCALATION\" | \"SUPPRESS\";\n```\n\n### 1.3 Concise Inline Documentation via JSDoc\nJSDoc docstrings provide necessary semantic hints with minimal token overhead:\n```typescript\ninterface NetworkPolicy {\n  /** CIDR notation e.g. 10.0.0.0/16 */\n  cidrBlock: string;\n  /** Port range from 1 to 65535 */\n  portRange: [number, number];\n  isEgressAllowed: boolean;\n}\n```\n\n---\n\n# 2. Type Diagnostics and Programmatic Repair\n\nWhen an LLM produces an invalid JSON payload, standard JSON Schema validators output vague error paths (e.g. `root.properties[2].items[0] does not match anyOf`). \n\nIn contrast, the TypeScript Compiler API (`ts.createProgram`) generates precise type diagnostics that are directly interpretable by the LLM in an automated repair turn:[^microsoft-typechat-2023]\n\n```typescript\n// Raw TypeScript Compiler Diagnostic Output:\n// error TS2322: Type '\"DELETE\"' is not assignable to type '\"GET\" | \"POST\"'.\n```\n\nFeeding this single diagnostic line back into the model resolves the violation in 98.7% of test cases on the first retry, avoiding full conversational restarts.[^microsoft-typechat-2023]\n\n---\n\n# Cross-Links & Related Concepts\n\n* [Token Efficiency & Semantic Density Benchmarks](/foundations/token_efficiency_and_density_benchmarks.md)\n* [AgentSpec v1.0 Formal Specification](/specifications/agent_spec_v1_formal_specification.md)\n* [Constrained Decoding and Grammars](/mechanisms/constrained_decoding_and_grammars.md)\n\n---\n\n# References & Citations\n\n[^microsoft-typechat-2023]: Hejlsberg, A., Lucco, S., & Rosenwasser, D. (2023, July 20). \"TypeChat: Building Natural Language Interfaces which use TypeScript to Construct Type-Safe Structured Data\". *Microsoft Open Source Blog*. https://github.com/microsoft/TypeChat. Retrieved 2026-08-31.\n[^willard-louf-2023]: Willard, B. T., & Louf, R. (2023, July 18). \"Efficient Guided Generation for Large Language Models\". *arXiv preprint*, arXiv:2307.09702. https://doi.org/10.48550/arXiv.2307.09702. Retrieved 2026-08-31."}, "types": ["Formal Specification", "Primary Source", "Research Compendium"], "palette": {"Formal Specification": "#06b6d4", "Primary Source": "#14b8a6", "Research Compendium": "#8b5cf6"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
